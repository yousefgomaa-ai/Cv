<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Yousef Mohamed Gomaa - General Accountant experienced in treasury, accounts payable, accounts receivable, tax, payroll and financial reporting.">
<meta name="theme-color" content="#0b1020">
<title>Yousef Gomaa | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --bg2:#0f1629; --card:rgba(20,28,50,.66); --card-solid:#141c32;
  --line:rgba(148,163,184,.14); --line-strong:rgba(148,163,184,.28);
  --text:#e8ecf5; --muted:#94a3b8; --soft:#cbd5e1;
  --accent:#34d399; --accent2:#38bdf8; --gold:#fbbf24;
  --accent-bg:rgba(52,211,153,.12); --shadow:0 20px 50px -20px rgba(0,0,0,.6);
  --radius:20px; --font:"Inter",system-ui,"Segoe UI",sans-serif;
}
[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#ffffff; --card:rgba(255,255,255,.82); --card-solid:#fff;
  --line:rgba(15,23,42,.09); --line-strong:rgba(15,23,42,.18);
  --text:#0f172a; --muted:#64748b; --soft:#334155;
  --accent:#059669; --accent2:#0284c7; --gold:#b45309;
  --accent-bg:rgba(5,150,105,.1); --shadow:0 20px 45px -25px rgba(15,23,42,.35);
}
[dir="rtl"]{ --font:"Cairo","Inter",system-ui,sans-serif; }
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.7 var(--font);overflow-x:hidden;transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
svg{width:1em;height:1em;flex:none}
.wrap{max-width:1140px;margin:auto;padding:0 20px}

/* background */
.bg-grid{position:fixed;inset:0;z-index:-2;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%);opacity:.55}
.blob{position:fixed;z-index:-1;width:480px;height:480px;border-radius:50%;filter:blur(120px);opacity:.22;pointer-events:none}
.blob.a{top:-160px;inset-inline-start:-140px;background:var(--accent)}
.blob.b{top:40%;inset-inline-end:-180px;background:var(--accent2)}
.spot{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(500px circle at var(--mx,50%) var(--my,30%),rgba(56,189,248,.07),transparent 60%)}

/* progress + header */
.progress{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,var(--accent),var(--accent2))}
header.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid transparent;transition:border-color .3s}
header.top.scrolled{border-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
.logo b{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04121a;font-size:.95rem}
.menu{display:flex;gap:4px;margin-inline-start:auto}
.menu a{padding:8px 13px;border-radius:10px;font-size:.92rem;color:var(--muted);font-weight:500;transition:.2s}
.menu a:hover{color:var(--text);background:var(--line)}
.menu a.active{color:var(--accent);background:var(--accent-bg)}
.tools{display:flex;gap:8px}
.icon-btn{display:grid;place-items:center;min-width:40px;height:40px;padding:0 10px;border-radius:11px;border:1px solid var(--line-strong);background:var(--card);font-weight:700;font-size:.9rem;transition:.2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.burger{display:none}

/* hero */
.hero{padding:70px 0 40px;display:grid;grid-template-columns:1.35fr .9fr;gap:50px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;border:1px solid var(--line-strong);background:var(--card);font-size:.85rem;color:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
h1{margin:18px 0 8px;font-size:clamp(2.3rem,5.4vw,4rem);line-height:1.08;letter-spacing:-.03em;font-weight:800}
[dir="rtl"] h1{line-height:1.3;letter-spacing:0}
h1 .grad{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-size:clamp(1.1rem,2.2vw,1.4rem);color:var(--soft);min-height:2.2em;font-weight:600}
.role .typed{color:var(--accent)}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-3px;margin-inline-start:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{color:var(--muted);max-width:600px;margin:14px 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:13px;font-weight:600;border:1px solid var(--line-strong);background:var(--card);transition:.25s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#04121a}
.btn.primary:hover{box-shadow:0 12px 30px -10px var(--accent)}
.photo-wrap{position:relative;justify-self:center;width:min(340px,80vw);aspect-ratio:1;perspective:900px}
.photo{position:absolute;inset:0;border-radius:32px;overflow:hidden;border:1px solid var(--line-strong);box-shadow:var(--shadow);transform-style:preserve-3d;transition:transform .2s ease-out}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo-wrap::before{content:"";position:absolute;inset:-14px;border-radius:40px;background:conic-gradient(from var(--ang,0deg),var(--accent),var(--accent2),transparent 40%,var(--accent));opacity:.45;filter:blur(18px);animation:spin 8s linear infinite}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.float-tag{position:absolute;display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:13px;background:var(--card-solid);border:1px solid var(--line-strong);box-shadow:var(--shadow);font-size:.82rem;font-weight:600;animation:bob 5s ease-in-out infinite;white-space:nowrap}
.float-tag svg{color:var(--accent);font-size:1.1rem}
.float-tag.t1{top:10%;inset-inline-start:-14%}
.float-tag.t2{bottom:12%;inset-inline-end:-12%;animation-delay:-2.5s}
@keyframes bob{50%{transform:translateY(-10px)}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0 20px}
.stat{padding:22px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);text-align:center}
.stat strong{display:block;font-size:2.2rem;font-weight:800;line-height:1.1;background:linear-gradient(120deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-size:.9rem}

/* sections */
section.sec{padding:70px 0 20px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.eyebrow{color:var(--accent);font-weight:700;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase}
[dir="rtl"] .eyebrow{letter-spacing:0}
h2{margin:6px 0 0;font-size:clamp(1.7rem,3.2vw,2.4rem);letter-spacing:-.02em;line-height:1.2}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;backdrop-filter:blur(14px);transition:border-color .3s,transform .3s,opacity .3s}
.card.glow::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(380px circle at var(--x) var(--y),rgba(52,211,153,.1),transparent 60%)}
.card.glow:hover::after{opacity:1}
.card:hover{border-color:var(--line-strong)}

/* about */
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.about p{margin:0;color:var(--soft);font-size:1.05rem}
.info{display:grid;gap:12px}
.info-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--line);font-size:.93rem;min-width:0}
.info-row svg{color:var(--accent);font-size:1.15rem}
.info-row small{display:block;color:var(--muted);font-size:.76rem;line-height:1.3}
.info-row div{min-width:0;overflow-wrap:anywhere}
.highlights{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line-strong);font-size:.84rem;color:var(--soft);background:transparent;transition:.2s}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#04121a;font-weight:600}
.chip.static{background:var(--accent-bg);border-color:transparent;color:var(--accent);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px}

/* timeline */
.timeline{position:relative;padding-inline-start:34px}
.timeline::before{content:"";position:absolute;top:8px;bottom:8px;inset-inline-start:9px;width:2px;background:linear-gradient(var(--accent),var(--accent2),transparent)}
.job{margin-bottom:20px}
.job::before{content:"";position:absolute;top:30px;inset-inline-start:-31px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);box-shadow:0 0 0 5px var(--accent-bg)}
.job.dim{opacity:.32;transform:scale(.985)}
.job-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:start}
.job h3{margin:0;font-size:1.22rem;line-height:1.35}
.company{color:var(--accent);font-weight:600;margin-top:2px}
.company small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}
.when{display:flex;flex-direction:column;align-items:end;gap:6px}
[dir="rtl"] .when{align-items:start}
.date{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:9px;background:var(--line);font-size:.84rem;font-weight:600;color:var(--soft);white-space:nowrap}
.dur{font-size:.78rem;color:var(--muted)}
.now{color:var(--accent);background:var(--accent-bg)}
.job .tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.job .tags span{font-size:.75rem;padding:3px 9px;border-radius:7px;background:var(--line);color:var(--muted);transition:.2s}
.job .tags span.hit{background:var(--accent);color:#04121a}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--line);margin:16px 0 4px}
.tabs button{padding:6px 14px;border-radius:9px;border:0;background:transparent;font-size:.86rem;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card-solid);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tasks{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.tasks li{display:flex;gap:11px;color:var(--soft);font-size:.95rem;line-height:1.6}
.tasks li svg{color:var(--accent);margin-top:5px;font-size:.95rem}
.tasks li.extra{display:none}
.job.open .tasks li.extra{display:flex;animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}
.more{margin-top:14px;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:10px;border:1px solid var(--line-strong);background:transparent;font-size:.86rem;font-weight:600;color:var(--accent);transition:.2s}
.more:hover{background:var(--accent-bg)}
.more svg{transition:transform .3s}
.job.open .more svg{transform:rotate(180deg)}

/* odoo */
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.step{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.92rem;animation:stepGlow 6s infinite}
.step b{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent-bg);color:var(--accent);font-size:.8rem}
.step:nth-of-type(2){animation-delay:1.5s}.step:nth-of-type(3){animation-delay:3s}.step:nth-of-type(4){animation-delay:4.5s}
@keyframes stepGlow{0%,20%{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}30%,100%{border-color:var(--line);box-shadow:none}}
.arrow{color:var(--muted);font-size:1.1rem}
[dir="rtl"] .arrow{transform:scaleX(-1)}
.odoo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.mod{width:100%;text-align:start;padding:20px;border:1px solid var(--line);display:block;cursor:pointer}
.mod:hover{transform:translateY(-3px)}
.mod.open{border-color:var(--accent)}
.mod-head{display:flex;align-items:center;gap:12px}
.mod-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--accent-bg);color:var(--accent);font-size:1.25rem;flex:none;transition:.3s}
.mod.open .mod-ic,.mod:hover .mod-ic{background:var(--accent);color:#04121a}
.mod h3{margin:0;font-size:1rem;line-height:1.35}
.mod p{margin:10px 0 0;color:var(--muted);font-size:.88rem;line-height:1.55}
.mod .plus{margin-inline-start:auto;color:var(--muted);transition:transform .3s}
.mod.open .plus{transform:rotate(45deg);color:var(--accent)}
.mod ul{display:none;list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:1px dashed var(--line-strong);gap:8px}
.mod.open ul{display:grid;animation:fadeIn .35s both}
.mod li{display:flex;gap:9px;font-size:.87rem;color:var(--soft);line-height:1.5}
.mod li svg{color:var(--accent);margin-top:4px;font-size:.85rem}

/* dashboards */
.ai-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.ai-card{display:flex;gap:14px;align-items:flex-start;padding:18px}
.ai-card h3{margin:0 0 4px;font-size:1rem}
.ai-card p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.55}
.ai-card .mod-ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04121a}
.dash-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.dash-tab{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;border:1px solid var(--line);background:var(--card);text-align:start;transition:.25s}
.dash-tab:hover{border-color:var(--line-strong)}
.dash-tab.on{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.dash-tab b{display:block;font-size:.92rem;line-height:1.3}
.dash-tab small{color:var(--muted);font-size:.78rem}
.dt-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;flex:none;color:#fff;font-size:1.1rem}
.dt-ic.tool-excel,.tool-excel .tool-badge{background:#1d6f42}
.dt-ic.tool-pbi,.tool-pbi .tool-badge{background:#c99a06}
.dash-frame{
  --surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--ink3:#77766f;--gridc:#e4e3df;--axisc:#c9c8c2;
  --s1:#2a78d6;--s2:#eb6834;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#104281;
  --good:#0a7d0a;--bad:#c62f2f;--panel:#f3f3f0;
  position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-family:"Inter",system-ui,sans-serif}
[data-theme="dark"] .dash-frame{
  --surface:#161d30;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#9a998f;--gridc:#262f45;--axisc:#3a4560;
  --s1:#3987e5;--s2:#d95926;--o1:#1c5cab;--o2:#256abf;--o3:#3987e5;--o4:#6da7ec;--o5:#9ec5f4;
  --good:#3fbf3f;--bad:#ef6b6b;--panel:#1c2439}
.dash-chrome{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--gridc);font-size:.8rem;color:var(--ink2)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--axisc)}
.tool-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;color:#fff;font-weight:700}
.file{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sample{margin-inline-start:auto;padding:2px 8px;border-radius:6px;border:1px solid var(--axisc);font-size:.72rem;white-space:nowrap}
.dash-body{padding:18px}
.dash-title h3{margin:0;font-size:1.15rem;color:var(--ink)}
.dash-title p{margin:2px 0 0;color:var(--ink2);font-size:.86rem}
.slicers{display:flex;flex-wrap:wrap;gap:14px 22px;margin:14px 0}
.slicer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sl-label{font-size:.78rem;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.sl-opts{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--gridc)}
.sl-btn{padding:5px 12px;border:0;border-radius:8px;background:transparent;font-size:.83rem;font-weight:600;color:var(--ink2)}
.sl-btn:hover{color:var(--ink)}
.sl-btn.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;border-radius:12px}
.kpi{padding:13px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--gridc);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-name{font-size:.78rem;color:var(--ink2);font-weight:600}
.kpi-val{font-size:1.32rem;font-weight:800;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi-delta{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600}
.kpi-delta svg{width:.9em;height:.9em}
.kpi-delta.good{color:var(--good)}.kpi-delta.bad{color:var(--bad)}
.kpi-delta .muted,.kpi-delta.muted{color:var(--ink3);font-weight:500}
.dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.viz-card{padding:14px;border-radius:12px;border:1px solid var(--gridc);background:var(--surface);min-width:0;transition:box-shadow .3s,border-color .3s}
.viz-card.wide{grid-column:1/-1}
.viz-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.viz-head h4{margin:0;font-size:.9rem;color:var(--ink)}
.viz-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;border:1px solid var(--gridc);background:transparent;font-size:.75rem;color:var(--ink2)}
.viz-toggle:hover{color:var(--ink);border-color:var(--axisc)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--ink2);margin-bottom:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-line{width:14px;height:2px;border-radius:2px}.lg-rect{width:10px;height:10px;border-radius:3px}
.viz-body{min-height:60px;overflow:hidden}
.dash-frame svg.viz{display:block;width:100%;height:auto;overflow:visible}
.viz .grid{stroke:var(--gridc);stroke-width:1}.viz .axis{stroke:var(--axisc);stroke-width:1}
.viz .tick{fill:var(--ink3);font-size:11px}
.viz .cat{fill:var(--ink2);font-size:12px}
.viz .val{fill:var(--ink);font-size:11.5px;font-weight:600}
.viz .end-label{fill:var(--ink2);font-size:11.5px;font-weight:600}
.viz .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.viz .pt,.viz .hover-dot{stroke:var(--surface);stroke-width:2}
.viz .cross{stroke:var(--ink3);stroke-width:1}
.viz .bar-g{cursor:pointer;outline:none}
.viz .bar-g:hover .bar,.viz .bar-g:focus .bar{filter:brightness(1.15)}
.viz .bar-g.dim .bar{opacity:.28}
.viz-table{width:100%;border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums}
.viz-table th,.viz-table td{padding:5px 8px;text-align:start;border-bottom:1px solid var(--gridc);color:var(--ink)}
.viz-table th{color:var(--ink2);font-weight:600}
.ai-panel{margin-top:12px;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,rgba(52,211,153,.10),rgba(56,189,248,.08));border:1px solid var(--gridc)}
.ai-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ai-badge{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:.9rem;color:var(--ink)}
.ai-badge svg{color:#10b981}
.ai-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;border:0;background:linear-gradient(135deg,#34d399,#38bdf8);color:#04121a;font-weight:700;font-size:.82rem}
.ai-btn.busy svg{animation:spin2 1s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.ai-out{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:.87rem;color:var(--ink);min-height:24px}
.ai-out li{position:relative;padding-inline-start:16px;line-height:1.55}
.ai-out li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;width:6px;height:6px;border-radius:2px;background:#10b981;transform:rotate(45deg)}
.ai-out .ai-hint{color:var(--ink3)}.ai-out .ai-hint::before{display:none}
.ai-think{color:var(--ink2)}.ai-think::after{content:"…";animation:blink 1s steps(1) infinite}
.spot-on{box-shadow:0 0 0 3px var(--s1)!important;border-color:transparent!important;border-radius:12px}
.player-wrap{position:relative;z-index:4;background:var(--panel);border-top:1px solid var(--gridc)}
.player{display:flex;align-items:center;gap:12px;padding:6px 14px 12px}
.pp{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:0;background:var(--s1);color:#fff;flex:none}
.track{position:relative;flex:1;height:6px;border-radius:99px;background:var(--gridc);cursor:pointer}
.track::before{content:"";position:absolute;inset:-10px 0}
.fill{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:inherit;background:var(--s1)}
.tick{position:absolute;top:-2px;width:2px;height:10px;background:var(--surface);opacity:.9}
.time{font-size:.76rem;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:74px;text-align:end}
.caption{display:flex;gap:10px;align-items:center;padding:12px 14px 4px;color:var(--ink);font-size:.88rem;min-height:44px}
.cap-step{flex:none;padding:2px 8px;border-radius:6px;background:#34d399;color:#04121a;font-weight:700;font-size:.74rem}
.vcursor{position:absolute;top:0;left:0;z-index:6;width:22px;height:22px;pointer-events:none;opacity:0;transition:transform .75s cubic-bezier(.4,0,.2,1),opacity .3s;transform:translate(50%,40%)}
.vcursor svg{width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.dash-frame.playing .vcursor{opacity:1}
.ripple{position:absolute;left:-9px;top:-9px;width:22px;height:22px;border-radius:50%;border:2px solid var(--s1);opacity:0}
.vcursor.click .ripple{animation:rip .6s ease-out}
@keyframes rip{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(2)}}
.play-overlay{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:0;background:rgba(8,12,24,.55);backdrop-filter:blur(2px);color:#fff;font-size:1.05rem;font-weight:700;transition:.3s}
.play-overlay small{font-weight:500;opacity:.8;font-size:.82rem}
.big-play{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#34d399,#38bdf8);color:#04121a;font-size:1.9rem;box-shadow:0 0 0 10px rgba(52,211,153,.2);transition:transform .3s}
.play-overlay:hover .big-play{transform:scale(1.08)}
.dash-frame.started .play-overlay{opacity:0;pointer-events:none}
.viz-tip{position:fixed;z-index:80;pointer-events:none;min-width:130px;padding:9px 11px;border-radius:10px;background:var(--card-solid);border:1px solid var(--line-strong);box-shadow:var(--shadow);font:500 12px/1.45 "Inter",system-ui,sans-serif;color:var(--text);opacity:0;transition:opacity .15s}
.viz-tip.show{opacity:1}
.tt-title{color:var(--muted);font-weight:600;margin-bottom:4px}
.tt-row{display:flex;align-items:center;gap:7px}
.tt-row strong{font-size:13px;font-variant-numeric:tabular-nums}
.tt-row span{color:var(--muted)}
.tt-key{width:12px;height:2px;border-radius:2px;flex:none}

/* edu */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.edu-icon{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;background:var(--accent-bg);color:var(--accent);font-size:1.5rem;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:1.15rem}
.meta{color:var(--muted);font-size:.92rem}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* skills */
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;align-items:start}
.skills .card h3{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.skills .card h3 svg{color:var(--accent)}
.sk-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sk-list li{display:flex;gap:10px;color:var(--soft);font-size:.93rem;line-height:1.55}
.sk-list li::before{content:"";flex:none;width:7px;height:7px;margin-top:9px;border-radius:2px;background:linear-gradient(135deg,var(--accent),var(--accent2));transform:rotate(45deg)}
.level{margin-bottom:16px}
.level-top{display:flex;justify-content:space-between;font-size:.92rem;font-weight:600;margin-bottom:7px}
.level-top span{color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.soft-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.soft{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px;text-align:center;font-weight:600;font-size:.93rem}
.soft svg{font-size:1.6rem;color:var(--accent);transition:transform .35s}
.soft:hover svg{transform:scale(1.2) rotate(-6deg)}

/* contact */
.contact-box{display:grid;grid-template-columns:1fr 1.2fr;gap:30px;align-items:center;padding:38px;overflow:hidden}
.contact-box::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(135deg,var(--accent-bg),transparent 60%)}
.contact-list{display:grid;gap:12px}
.c-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:15px;border:1px solid var(--line);background:var(--card-solid);transition:.25s;min-width:0}
.c-item:hover{border-color:var(--accent);transform:translateX(4px)}
[dir="rtl"] .c-item:hover{transform:translateX(-4px)}
.c-item .ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--accent-bg);color:var(--accent);font-size:1.2rem;flex:none}
.c-item div{flex:1;min-width:0;overflow-wrap:anywhere}
.c-item small{display:block;color:var(--muted);font-size:.78rem}
.c-item .copy{border:0;background:var(--line);border-radius:9px;padding:7px;display:grid;place-items:center;color:var(--muted)}
.c-item .copy:hover{color:var(--accent)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

footer{padding:50px 0 40px;text-align:center;color:var(--muted);font-size:.9rem}
.totop{position:fixed;bottom:22px;inset-inline-end:22px;z-index:40;width:46px;height:46px;border-radius:14px;border:1px solid var(--line-strong);background:var(--card-solid);display:grid;place-items:center;opacity:0;transform:translateY(16px);pointer-events:none;transition:.3s;box-shadow:var(--shadow)}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);z-index:70;padding:11px 20px;border-radius:12px;background:var(--accent);color:#04121a;font-weight:600;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* reveal */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}

/* responsive */
@media(max-width:960px){
  .menu{position:fixed;top:68px;inset-inline:12px;flex-direction:column;padding:10px;border-radius:16px;background:var(--card-solid);border:1px solid var(--line-strong);box-shadow:var(--shadow);transform:translateY(-12px);opacity:0;pointer-events:none;transition:.25s}
  .menu.open{transform:none;opacity:1;pointer-events:auto}
  .menu a{padding:11px 14px}
  .burger{display:grid}
  .tools{margin-inline-start:auto}
  .hero{grid-template-columns:1fr;text-align:center;padding-top:40px}

  .ai-strip,.dash-tabs{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .dash-grid{grid-template-columns:1fr}
  .soft-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){

  .odoo-grid{grid-template-columns:1fr}

  .job::before{inset-inline-start:-26px;width:12px;height:12px}
  .when{align-items:start}
  .logo span{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none}
}
@media print{

  .reveal{opacity:1;transform:none}
}

function duration(s, e, L){

  return [y ? `${y} ${T[L].yr}` : '', r ? `${r} ${T[L].mo}` : ''].filter(Boolean).join(' ');
}

/* typing */
let typeTimer;
function restartTyping(){
  clearTimeout(typeTimer); const el = $('#typed'); const words = T[lang].roles;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = words[0]; return; }
  let w = 0, c = 0, del = false;
  (function tick(){
    const word = words[w]; el.textContent = word.slice(0, c);
    if (!del && c < word.length){ c++; typeTimer = setTimeout(tick, 75); }
    else if (!del){ del = true; typeTimer = setTimeout(tick, 1700); }
    else if (c > 0){ c--; typeTimer = setTimeout(tick, 35); }
    else { del = false; w = (w+1) % words.length; typeTimer = setTimeout(tick, 300); }
  })();
}

/* reveal + counters + bars */
const io = new IntersectionObserver(entries => entries.forEach(en => {
  if (!en.isIntersecting) return; en.target.classList.add('in'); io.unobserve(en.target);
  en.target.querySelectorAll('[data-count]').forEach(countUp);
}), { threshold:0, rootMargin:'0px 0px -8% 0px' });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
function countUp(el){
  const end = +el.dataset.count, suf = el.dataset.suffix || ''; let s = null;
  const step = ts => { if(!s) s = ts; const p = Math.min((ts-s)/1200, 1); el.textContent = Math.round(end * (1-Math.pow(1-p,3))) + suf; if (p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
let barsSeen = false;
const barIO = new IntersectionObserver(en => { if (en.some(x=>x.isIntersecting)){ barsSeen = true; fillBars(); barIO.disconnect(); } }, {threshold:.3});
barIO.observe($('#skills'));
function fillBars(){ if (!barsSeen) return; requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%')); }

  scope.querySelectorAll('.glow').forEach(c => c.onmousemove = e => { const r = c.getBoundingClientRect(); c.style.setProperty('--x', (e.clientX-r.left)+'px'); c.style.setProperty('--y', (e.clientY-r.top)+'px'); });
}

/* photo tilt + spotlight */
const pw = $('#photoWrap'), ph = $('#photo');
pw.addEventListener('mousemove', e => { const r = pw.getBoundingClientRect(); const x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5; ph.style.transform = `rotateY(${x*14}deg) rotateX(${-y*14}deg)`; });
pw.addEventListener('mouseleave', () => ph.style.transform = '');
addEventListener('pointermove', e => { document.body.style.setProperty('--mx', e.clientX+'px'); document.body.style.setProperty('--my', e.clientY+'px'); }, {passive:true});

/* scroll: progress, header, scrollspy, to-top */
const links = [...document.querySelectorAll('.menu a')];
const secs = links.map(a => $(a.getAttribute('href')));
function onScroll(){
  const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
  $('#progress').style.width = (h>0 ? y/h*100 : 0) + '%';
  $('#top').classList.toggle('scrolled', y > 10);
  $('#totop').classList.toggle('show', y > 600);
  let cur = -1; secs.forEach((s,i) => { if (s.getBoundingClientRect().top < innerHeight*.4) cur = i; });
  links.forEach((a,i) => a.classList.toggle('active', i===cur));
}
addEventListener('scroll', onScroll, {passive:true});
$('#totop').onclick = () => scrollTo({top:0, behavior:'smooth'});

render(); onScroll();
</script>
<script src="./dashboards.js"></script>
</body>
</html>
