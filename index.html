  <meta name="description" content="Yousef Mohamed Gomaa - Accountant experienced in treasury, accounts payable, accounts receivable, and financial reporting.">

  <style>
    :root { --bg:#060413; --card:rgba(15,11,42,.72); --hover:rgba(26,20,68,.8); --purple:#a855f7; --indigo:#6366f1; --text:#fff; --muted:#c7cad4; --border:rgba(168,85,247,.25); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--text); font:400 16px/1.7 Poppins,system-ui,sans-serif; }
    html[lang="ar"] body { font-family:Cairo,system-ui,sans-serif; }
    body::before,body::after { content:""; position:fixed; width:320px; height:320px; border-radius:50%; filter:blur(110px); opacity:.25; pointer-events:none; z-index:-1; }
    body::before { top:-130px; left:-130px; background:var(--indigo); }
    body::after { right:-130px; bottom:5%; background:var(--purple); }
    a { color:#d8b4fe; }
    a:focus-visible,button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
    .wrap { max-width:1100px; margin:auto; padding:0 20px; }
    .topbar { display:flex; justify-content:flex-end; padding-top:22px; }
    .lang-button,.nav-button,.download { border:1px solid var(--border); border-radius:12px
